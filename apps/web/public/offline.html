<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#0A0E18">
    <title>Lollipop — Offline</title>
    <style>
      html,body{margin:0;min-height:100%;background:#0A0E18;color:#F4F7FF;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
      body{display:grid;place-items:center;padding:24px;box-sizing:border-box}
      main{max-width:420px;text-align:center}
      .mark{font-size:44px;margin-bottom:18px}
      h1{font-size:32px;margin:0 0 12px}
      p{color:#9DA8BE;line-height:1.6}
      button{margin-top:12px;padding:12px 18px;border:0;border-radius:12px;background:#7083FF;color:white;font-weight:700}
    </style>
  </head>
  <body>
    <main>
      <div class="mark">◉</div>
      <h1>You're offline.</h1>
      <p>Lollipop is available again as soon as your connection returns.</p>
      <button onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
